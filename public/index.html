<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mariinsky — a memory collective</title>
<meta name="description" content="A shared wall of memories. Leave one moment; it becomes a marble. Every time somebody opens it, a little more of it is gone.">
<meta property="og:title" content="mariinsky — a memory collective">
<meta property="og:description" content="Leave one moment. It becomes a marble on a shared wall, and it fades every time it is looked at.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Patrick+Hand&family=Sriracha&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%23fdfcf8'/><ellipse cx='16' cy='16' rx='14' ry='5' fill='%233d6fc4' transform='rotate(-28 16 16)'/><circle cx='11' cy='11' r='3' fill='white' opacity='.85'/></svg>">
</head>
<body>
  <div id="app"><div class="loading">…</div></div>
  <div id="overlay"></div>
  <script>
  // A single dropped request used to leave this page on "…" for ever. An ES
  // module graph that fails to fetch is never retried, and the failure is
  // remembered for the life of the document, so the only reliable cure is a
  // fresh document. Boot failures therefore reload -- a bounded number of
  // times, so a genuinely broken deploy ends in a sentence rather than a loop.
  (function () {
    var KEY = 'mariinsky:boot-retries';
    var MAX = 2;
    var WAIT = 15000;
    var settled = false;
    var timer = null;
    var tries = 0;
    try { tries = parseInt(sessionStorage.getItem(KEY), 10) || 0; } catch (e) {}

    function forget() { try { sessionStorage.removeItem(KEY); } catch (e) {} }

    window.__booted = function () {
      settled = true;
      clearTimeout(timer);
      forget();
    };

    window.__recover = function (why) {
      if (settled && !why) return;
      settled = true;
      clearTimeout(timer);
      if (tries >= MAX) return giveUp(why);
      try { sessionStorage.setItem(KEY, String(tries + 1)); } catch (e) {}
      location.reload();
    };

    function giveUp(why) {
      forget();
      var app = document.getElementById('app');
      if (!app) return;
      app.innerHTML =
        '<div class="loading">'
        + '<p data-role="why"></p>'
        + '<p class="loading-aside">the memories are safe; this page just could not finish loading.</p>'
        + '<button class="btn" data-act="boot-retry">try again</button>'
        + '</div>';
      app.querySelector('[data-role=why]').textContent = why || 'the collection could not be reached.';
      app.querySelector('[data-act=boot-retry]').addEventListener('click', function () {
        location.reload();
      });
    }

    // A module script that cannot fetch itself or one of its dependencies fires
    // `error` on the element, not as a script error, so it is caught here.
    window.addEventListener('error', function (e) {
      var el = e.target;
      if (el && el !== window && el.tagName === 'SCRIPT' && el.type === 'module') {
        window.__recover('a piece of the page did not arrive.');
      }
    }, true);

    // Nothing failed outright, but nothing booted either -- a stalled fetch
    // looks exactly like the old silent "…", so it is treated the same way.
    timer = setTimeout(function () {
      if (!settled) window.__recover('the collection is taking too long to answer.');
    }, WAIT);
  })();
  </script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
